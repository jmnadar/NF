<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim CRM — Documentación del Proyecto</title>
<style>
:root {
  --bg: #f1f5f9; --surface: #fff; --border: #e5e7eb;
  --text: #1f2937; --text-sec: #6b7280; --primary: #2563eb;
  --primary-hover: #1d4ed8; --accent: #3b82f6;
  --sidebar-bg: #fff; --code-bg: #f8fafc;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
  --radius: 1.25rem;
}
.dark {
  --bg: #000; --surface: #030712; --border: #1f2937;
  --text: #f9fafb; --text-sec: #9ca3af; --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --sidebar-bg: #030712; --code-bg: #111827;
  --shadow: 0 1px 3px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh; transition: .3s;
}
.sidebar {
  width: 300px; background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  height: 100vh; position: sticky; top: 0;
  overflow-y: auto; flex-shrink: 0; padding: 0;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 20px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h1 {
  font-size: 18px; font-weight: 800;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.sidebar-header .version { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
.search-box {
  margin: 12px 16px; position: relative;
}
.search-box input {
  width: 100%; padding: 8px 12px 8px 36px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg); color: var(--text);
  font-size: 13px; outline: none; transition: .2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-sec);
}
.nav-section { margin-bottom: 4px; }
.nav-category {
  padding: 6px 20px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-sec); cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  user-select: none; transition: .2s;
}
.nav-category:hover { color: var(--primary); }
.nav-category .arrow {
  font-size: 10px; transition: transform .2s;
}
.nav-category.open .arrow { transform: rotate(90deg); }
.nav-items { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
.nav-items.open { max-height: 2000px; }
.nav-item {
  display: block; padding: 7px 20px 7px 28px;
  font-size: 13px; color: var(--text-sec);
  text-decoration: none; cursor: pointer;
  border-left: 2px solid transparent; transition: .2s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-item:hover, .nav-item.active {
  color: var(--primary); border-left-color: var(--primary);
  background: rgba(37,99,235,.05);
}
.main {
  flex: 1; padding: 32px 40px; max-width: 960px;
  overflow-y: auto;
}
.main h1 {
  font-size: 28px; font-weight: 800; margin-bottom: 4px;
}
.main h1 small { font-size: 14px; font-weight: 400; color: var(--text-sec); }
.main h2 {
  font-size: 22px; font-weight: 700; margin: 32px 0 12px;
  padding-bottom: 8px; border-bottom: 2px solid var(--primary);
}
.main h3 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; }
.main h4 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--text-sec); }
.main p { margin: 8px 0; line-height: 1.7; }
.main ul, .main ol { margin: 8px 0; padding-left: 24px; }
.main li { margin: 4px 0; line-height: 1.6; }
.main pre {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; overflow-x: auto;
  font-size: 13px; line-height: 1.5; margin: 12px 0;
  font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
}
.main code {
  background: var(--code-bg); padding: 2px 6px;
  border-radius: 4px; font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}
.main pre code { background: none; padding: 0; }
.main table {
  width: 100%; border-collapse: collapse; margin: 12px 0;
  font-size: 13px;
}
.main th, .main td {
  border: 1px solid var(--border); padding: 8px 12px;
  text-align: left;
}
.main th {
  background: var(--code-bg); font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: .03em;
}
.main blockquote {
  border-left: 3px solid var(--primary); padding: 8px 16px;
  margin: 12px 0; background: var(--code-bg);
  border-radius: 0 8px 8px 0; font-size: 13px;
  color: var(--text-sec);
}
.main hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.section { display: none; }
.section.active { display: block; }
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.theme-toggle {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
  color: var(--text); font-size: 13px; display: flex;
  align-items: center; gap: 6px; transition: .2s;
}
.theme-toggle:hover { border-color: var(--primary); }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 600; margin: 0 2px;
}
.tag-blue { background: #dbeafe; color: #1d4ed8; }
.tag-green { background: #d1fae5; color: #065f46; }
.tag-red { background: #fee2e2; color: #991b1b; }
.tag-purple { background: #ede9fe; color: #5b21b6; }
.tag-orange { background: #ffedd5; color: #9a3412; }
.highlight { background: #fef08a; padding: 0 2px; }
.subtitle { font-size: 14px; color: var(--text-sec); margin-bottom: 16px; }
@media (max-width: 768px) {
  .sidebar { width: 100%; height: auto; position: relative; }
  body { flex-direction: column; }
  .main { padding: 20px; }
}
</style>

  'backend-middleware': `
    <h2>Middleware de Autenticación y Autorización</h2>
    <h3>authenticate</h3>
    <pre>export const authenticate = (req, res, next) => {
  let token = req.cookies?.token;
  if (!token) {
    const authHeader = req.headers.authorization;
    if (authHeader?.startsWith('Bearer '))
      token = authHeader.split(' ')[1];
  }
  if (!token) return res.status(401).json({ error: 'Token requerido.' });
  try {
    const decoded = verifyToken(token);
    req.user = decoded;
    next();
  } catch { res.status(401).json({ error: 'Token inválido.' }); }
};</pre>

    <h3>authorize(...allowedRoles)</h3>
    <pre>export const authorize = (...allowedRoles) => (req, res, next) => {
  if (!req.user) return res.status(401).json({ error: 'No autorizado.' });
  if (!allowedRoles.includes(req.user.role))
    return res.status(403).json({ error: 'Permisos insuficientes.' });
  next();
};</pre>

    <h3>validate(schema) — Zod</h3>
    <pre>export const validate = (schema) => async (req, res, next) => {
  try {
    await schema.parseAsync({ body: req.body, query: req.query, params: req.params });
    next();
  } catch (err) {
    if (err instanceof ZodError)
      return res.status(400).json({
        error: 'Error de validación',
        details: err.errors.map(e => ({ path: e.path.join('.'), message: e.message }))
      });
    res.status(500).json({ error: 'Error interno' });
  }
};</pre>

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '';
  for (const [key, section] of Object.entries(sections)) {
    if (section.children) {
      html += '<div class="nav-section">';
      html += `<div class="nav-category" onclick="toggleSection('${key}')" id="cat-${key}">`;
      html += `<span>${section.icon || ''} ${section.label}</span>`;
      html += '<span class="arrow">▶</span>';
      html += '</div>';
      html += `<div class="nav-items" id="items-${key}">`;
      for (const [childKey, childLabel] of Object.entries(section.children)) {
        html += `<a class="nav-item" data-section="${childKey}" onclick="showSection('${childKey}')">${childLabel}</a>`;
      }
      html += '</div></div>';
    } else {
      html += `<a class="nav-item" data-section="${key}" onclick="showSection('${key}')" style="margin: 4px 16px;border-left:none;padding-left:16px;font-weight:600">${section.icon || ''} ${section.label}</a>`;
    }
  }
  nav.innerHTML = html;

  const params = new URLSearchParams(window.location.hash.substring(1));
  const initial = params.get('section') || 'inicio';
  showSection(initial);
}

function toggleSection(key) {
  const items = document.getElementById(`items-${key}`);
  const cat = document.getElementById(`cat-${key}`);
  if (!items) return;
  items.classList.toggle('open');
  cat.classList.toggle('open');
}

function showSection(key) {
  document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  let existing = document.getElementById(`section-${key}`);
  if (!existing) {
    existing = document.createElement('div');
    existing.id = `section-${key}`;
    existing.className = 'section';
    existing.innerHTML = content[key] || '<h2>Sección no encontrada</h2>';
    document.getElementById('content').appendChild(existing);
  }
  existing.classList.add('active');

  const navItem = document.querySelector(`.nav-item[data-section="${key}"]`);
  if (navItem) navItem.classList.add('active');

  // auto-expand parent
  for (const [sk, sv] of Object.entries(sections)) {
    if (sv.children && sv.children[key]) {
      const items = document.getElementById(`items-${sk}`);
      const cat = document.getElementById(`cat-${sk}`);
      if (items && !items.classList.contains('open')) {
        items.classList.add('open');
        cat.classList.add('open');
      }
    }
  }

  window.location.hash = `section=${key}`;
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll('.nav-item').forEach(el => el.style.display = '');
    return;
  }
  document.querySelectorAll('.nav-item').forEach(el => {
    const match = el.textContent.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
    if (match) {
      const parentSection = el.closest('.nav-section');
      if (parentSection) {
        const cat = parentSection.querySelector('.nav-category');
        const items = parentSection.querySelector('.nav-items');
        if (cat && items) {
          items.classList.add('open');
          cat.classList.add('open');
        }
      }
    }
  });
});

buildNav();
</script>
